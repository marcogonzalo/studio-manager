# Dev (default): docker compose up
# Tests:        docker compose --profile test run --rm test
# Prod-like:    docker compose --profile prod up --build app-prod

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - app-next-cache:/app/.next
    extra_hosts:
      - "localhost:host-gateway"
    stdin_open: true
    tty: true
    # Next may exit 0 on a false file-watch restart; relaunch inside the container.
    command: ["sh", "/app/scripts/docker-dev.sh"]
    environment:
      # Cap V8 heap so Turbopack/dev cannot consume all host RAM (OOM → exit 137)
      NODE_OPTIONS: --max-old-space-size=3072
      # Native inotify on Mac bind mounts is noisy and makes Next exit 0. Poll instead.
      # Set DOCKER_DEV_POLLING=false to disable if CPU is too high.
      CHOKIDAR_USEPOLLING: ${DOCKER_DEV_POLLING:-true}
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: ${DOCKER_DEV_POLLING:-true}
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
    mem_limit: 4096m
    memswap_limit: 4096m
    init: true
    restart: unless-stopped
    healthcheck:
      # TCP only. HTTP GET / compiles the marketing home on every check (~5–8s) and
      # retriggers Turbopack watch → process.exit(0) → container restart loop.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('net').connect(3000,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(3000,()=>{s.destroy();process.exit(1)});",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  test:
    profiles: [test]
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_OPTIONS: --max-old-space-size=2048
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
    mem_limit: 4096m
    memswap_limit: 4096m
    command: ["pnpm", "test", "--", "--run"]

  app-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH}
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
    mem_limit: 2048m
    memswap_limit: 2048m
    init: true
    restart: unless-stopped

volumes:
  app-next-cache:
